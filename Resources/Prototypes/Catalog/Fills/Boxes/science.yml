- type: entity
  name: beaker box
  parent: BoxCardboard
  id: BoxBeaker
  description: A box full of beakers.
  components:
  - type: FloodMask # Floof - flooding
    sprite: # Floof - flooding
      sprite: _Floof/Flooding/Masks/BoxBeaker.rsi # Floof - flooding
      state: mask # Floof - flooding
  - type: Storage
    grid:
    - 0,0,3,2
    maxItemSize: Normal
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: LargeBeaker
          amount: 2
        - id: Beaker
          amount: 2
  - type: Sprite
    layers:
      - state: box
      - state: beaker
