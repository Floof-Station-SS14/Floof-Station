- type: entity
  name: syringe box
  parent: BoxCardboard
  id: BoxSyringe
  description: A box full of syringes.
  components:
  - type: FloodMask # Floof - flooding
    sprite: # Floof - flooding
      sprite: _Floof/Flooding/Masks/BoxSyringe.rsi # Floof - flooding
      state: mask # Floof - flooding
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Syringe
        amount: 6
  - type: Sprite
    layers:
      - state: box
      - state: syringe

