- type: entity
  name: vial box
  parent: BoxCardboard
  id: BoxVial
  description: A box full of vials.
  components:
  - type: FloodMask # Floof - flooding
    sprite: # Floof - flooding
      sprite: _Floof/Flooding/Masks/BoxVial.rsi # Floof - flooding
      state: mask # Floof - flooding
  - type: Storage
    grid:
    - 0,0,3,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ChemistryEmptyVial
          amount: 3
        - id: ChemistryEmptyVialSmall
        rolls: 2 # group the small vials on the right column
  - type: Sprite
    layers:
      - state: box
      - state: vials
